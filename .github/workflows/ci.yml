name: CI & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build solution
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:minimal `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:RegisterOutput=false
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }


      - name: Verify Release PE mitigations
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual Studio installation not found' }
          $tools = @(Get-ChildItem -LiteralPath (Join-Path $vsPath 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending)
          $dumpbin = $null
          foreach ($tool in $tools) {
            $candidate = Join-Path $tool.FullName 'bin\Hostx64\x64\dumpbin.exe'
            if (Test-Path -LiteralPath $candidate) { $dumpbin = $candidate; break }
          }
          if (-not $dumpbin) { throw 'x64 dumpbin.exe not found' }
          foreach ($binary in @('.\src\x64\Release\AlternateStreamOverlay.dll', '.\src\x64\Release\altstrm.exe')) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing Release binary: $binary" }
            $lines = & $dumpbin /headers /loadconfig $binary 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            $details = $lines -join [Environment]::NewLine
            Write-Host "--- $binary ---"
            $lines | Select-String -Pattern 'Guard', 'CF Instrumented', 'FID table present', 'CET compatible' | ForEach-Object { Write-Host $_.Line }
            if ($details -notmatch '(?im)^\s*[0-9A-F]+\s+Guard\b') { throw "Missing CFG PE characteristic in $binary" }
            if ($details -notmatch '(?im)^\s*CF Instrumented\b') { throw "Missing CFG instrumentation in $binary" }
            if ($details -notmatch '(?im)^\s*FID table present\b') { throw "Missing CFG function table in $binary" }
            if ($details -notmatch '(?im)\bCET compatible\b') { throw "Missing CET compatibility marker in $binary" }
          }

      - name: Run native C++ MSTest
        shell: pwsh
        run: |
          $vswhere = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe' }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual Studio installation not found' }
          $vstest = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          if (-not (Test-Path -LiteralPath $vstest)) { throw "VSTest executable not found: $vstest" }
          $testDll = '.\src\x64\${{ matrix.configuration }}\AlternateStreamTests.dll'
          if (-not (Test-Path -LiteralPath $testDll)) { throw "MSTest assembly not built: $testDll" }
          & $vstest $testDll '/Platform:x64' '/Logger:console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "MSTest failed with exit code $LASTEXITCODE" }

      - name: Run NTFS ADS smoke tests
        shell: pwsh
        run: |
          $exe = '.\src\x64\${{ matrix.configuration }}\altstrm.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "CLI executable not built: $exe" }
          & .\src\tests\Smoke-AlternateStreams.ps1 -ExePath $exe
          if (-not $?) { throw 'ADS smoke tests failed' }

  analyze:
    name: MSVC and clang-tidy (Release x64)
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Analyze native C++ projects
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:normal /p:Configuration=Release /p:Platform=x64 /p:RegisterOutput=false /p:RunCodeAnalysis=true
          if ($LASTEXITCODE -ne 0) { throw "MSVC static-analysis build failed with exit code $LASTEXITCODE" }

      - name: Analyze C++ Core Guidelines with clang-tidy
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:normal /p:Configuration=Release /p:Platform=x64 /p:RegisterOutput=false /p:RunCodeAnalysis=true /p:EnableMicrosoftCodeAnalysis=false /p:EnableClangTidyCodeAnalysis=true /p:ClangTidyChecks=cppcoreguidelines-*
          if ($LASTEXITCODE -ne 0) { throw "clang-tidy analysis build failed with exit code $LASTEXITCODE" }
