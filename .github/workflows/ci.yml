name: CI & Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    name: Check version matches CHANGELOG
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check version matches CHANGELOG
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath 'src/version.h' -Raw
          $parts = foreach ($n in 'MAJOR','MINOR','PATCH','BUILD') {
            $m = [regex]::Match($header, "(?m)^\s*#define\s+ASO_VERSION_$n\s+(\d+)\s*$")
            if (-not $m.Success) { throw "Missing ASO_VERSION_$n" }
            $m.Groups[1].Value
          }
          if ($parts[3] -ne '0') { throw 'ASO_VERSION_BUILD must be zero for a tagged release.' }
          $version = $parts[0..2] -join '.'
          $latest = [regex]::Match((Get-Content -LiteralPath 'CHANGELOG.md' -Raw),
            '(?m)^## \[(\d+\.\d+\.\d+)\]').Groups[1].Value
          if ($version -ne $latest) {
            throw "src/version.h ($version) differs from latest CHANGELOG release ($latest)."
          }
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Reject STL mutex use inside Explorer DLL
        shell: pwsh
        run: |
          $source = Get-ChildItem -LiteralPath 'src/AlternateStreamOverlay' -Recurse -File |
            Where-Object { $_.Extension -in @('.cpp', '.h') }
          $pattern = '#\s*include\s*<\s*(mutex|shared_mutex|condition_variable)\s*>|\bstd::(mutex|recursive_mutex|timed_mutex|recursive_timed_mutex|shared_mutex|shared_timed_mutex|lock_guard|unique_lock|scoped_lock|shared_lock|condition_variable|condition_variable_any)\b'
          # Verify the guard rejects representative forbidden source constructs.
          foreach ($sample in @('#include <mutex>', '#include <shared_mutex>', '#include <condition_variable>',
              'std::lock_guard<std::mutex>', 'std::shared_mutex', 'std::shared_lock<std::shared_mutex>',
              'std::condition_variable', 'std::condition_variable_any')) {
            if ($sample -notmatch $pattern) {
              throw "STL mutex guard failed its control input: $sample"
            }
          }
          $matches = @($source | Select-String -Pattern $pattern)
          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Explorer DLL must use Win32 SRW locks, not STL mutexes.'
          }

      - name: Build solution
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:normal `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:RegisterOutput=false
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }


      - name: Verify Release binary version resources
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath 'src/version.h' -Raw
          $parts = foreach ($n in 'MAJOR', 'MINOR', 'PATCH', 'BUILD') {
            $match = [regex]::Match($header, "(?m)^\\s*#define\\s+ASO_VERSION_$n\\s+(\\d+)\\s*$")
            if (-not $match.Success) { throw "Missing ASO_VERSION_$n" }
            [int]$match.Groups[1].Value
          }
          $expected = $parts -join '.'
          $binaries = @{
            '.\\src\\AlternateStreamOverlay\\x64\\Release\\AlternateStreamOverlay.dll' = 'AlternateStreamOverlay.dll'
            '.\\src\\x64\\Release\\altstrm.exe' = 'altstrm.exe'
          }
          foreach ($binary in $binaries.Keys) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing Release binary: $binary" }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path -LiteralPath $binary).Path)
            $actualFile = @($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart) -join '.'
            $actualProduct = @($info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart) -join '.'
            if ($actualFile -ne $expected -or $actualProduct -ne $expected) {
              throw "$binary VERSIONINFO mismatch: expected $expected, FileVersion=$actualFile, ProductVersion=$actualProduct"
            }
            if ($info.InternalName -ne $binaries[$binary] -or $info.OriginalFilename -ne $binaries[$binary]) {
              throw "$binary version string metadata mismatch: InternalName='$($info.InternalName)', OriginalFilename='$($info.OriginalFilename)'"
            }
            Write-Host "$binary VERSIONINFO: $actualFile; InternalName=$($info.InternalName)"
          }

      - name: Verify Release PE mitigations
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual Studio installation not found' }
          $tools = @(Get-ChildItem -LiteralPath (Join-Path $vsPath 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending)
          $dumpbin = $null
          foreach ($tool in $tools) {
            $candidate = Join-Path $tool.FullName 'bin\Hostx64\x64\dumpbin.exe'
            if (Test-Path -LiteralPath $candidate) { $dumpbin = $candidate; break }
          }
          if (-not $dumpbin) { throw 'x64 dumpbin.exe not found' }
          foreach ($binary in @('.\src\AlternateStreamOverlay\x64\Release\AlternateStreamOverlay.dll', '.\src\x64\Release\altstrm.exe')) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing Release binary: $binary" }
            $lines = & $dumpbin /headers /loadconfig $binary 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            $details = $lines -join [Environment]::NewLine
            Write-Host "--- $binary ---"
            $lines | Select-String -Pattern 'Guard', 'CF Instrumented', 'FID table present', 'CET compatible' | ForEach-Object { Write-Host $_.Line }
            if ($details -notmatch '(?im)^\s*Control Flow Guard\s*$') { throw "Missing CFG PE characteristic in $binary" }
            if ($details -notmatch '(?im)^\s*CF Instrumented\b') { throw "Missing CFG instrumentation in $binary" }
            if ($details -notmatch '(?im)^\s*FID table present\b') { throw "Missing CFG function table in $binary" }
            if ($details -notmatch '(?im)\bCET compatible\b') { throw "Missing CET compatibility marker in $binary" }
          }

      - name: Run native C++ MSTest
        shell: pwsh
        run: |
          $vswhere = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe' }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual Studio installation not found' }
          $vstest = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          if (-not (Test-Path -LiteralPath $vstest)) { throw "VSTest executable not found: $vstest" }
          $testDll = '.\src\x64\${{ matrix.configuration }}\AlternateStreamTests.dll'
          if (-not (Test-Path -LiteralPath $testDll)) { throw "MSTest assembly not built: $testDll" }
          $overlayDll = '.\src\AlternateStreamOverlay\x64\${{ matrix.configuration }}\AlternateStreamOverlay.dll'
          if (-not (Test-Path -LiteralPath $overlayDll)) { throw "Overlay DLL not built: $overlayDll" }
          $env:ASO_OVERLAY_DLL = (Resolve-Path -LiteralPath $overlayDll).Path
          & $vstest $testDll '/Platform:x64' '/Logger:console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "MSTest failed with exit code $LASTEXITCODE" }

      - name: Run NTFS ADS smoke tests
        shell: pwsh
        run: |
          $exe = '.\src\x64\${{ matrix.configuration }}\altstrm.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "CLI executable not built: $exe" }
          & .\src\tests\Smoke-AlternateStreams.ps1 -ExePath $exe
          if (-not $?) { throw 'ADS smoke tests failed' }

  cppcheck:
    name: Cppcheck (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Analyze native source
        shell: bash
        run: |
          cppcheck --version
          # Linux Cppcheck cannot expand Windows MIDL proxy or MSTest macros.
          # Analyze production code; generated proxy and test harness are built on Windows CI.
          # ATL registration metadata is irrelevant to the source-level analysis.
          cppcheck --enable=warning,performance,portability --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            '-DDECLARE_REGISTRY_RESOURCEID(x)=' \
            '-DDECLARE_REGISTRY_APPID_RESOURCEID(x,y)=' \
            '-DDECLARE_NOT_AGGREGATABLE(x)=' \
            '-DBEGIN_COM_MAP(x)=' \
            '-DCOM_INTERFACE_ENTRY(x)=' \
            '-DEND_COM_MAP()=' \
            '-DDECLARE_PROTECT_FINAL_CONSTRUCT()=' \
            '-DOBJECT_ENTRY_AUTO(x,y)=' \
            -isrc/AlternateStreamOverlay/dlldata.c \
            -isrc/AlternateStreamTests \
            --xml --xml-version=2 src 2> cppcheck-results.xml
          cat cppcheck-results.xml
          python3 - <<'PY'
          import collections
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("cppcheck-results.xml").getroot()
          findings = root.findall(".//errors/error")
          counts = collections.Counter(item.get("severity", "unknown") for item in findings)
          lines = ["### Cppcheck findings", "", "| Severity | Count |", "|---|---:|"]
          for severity in ("error", "warning", "performance", "portability", "style", "information", "unknown"):
              if counts[severity]:
                  lines.append(f"| {severity} | {counts[severity]} |")
          if not findings:
              lines.append("| None | 0 |")
          lines.extend(["", "#### Findings", "", "| Severity | Rule | Location | Message |", "|---|---|---|---|"])
          for item in sorted(findings, key=lambda e: (e.get("severity", ""), e.get("id", ""), e.get("msg", ""))):
              loc = item.find("location")
              location = f"{loc.get('file', '')}:{loc.get('line', '')}" if loc is not None else "—"
              values = (item.get("severity", ""), item.get("id", ""), location, item.get("msg", ""))
              lines.append("| " + " | ".join(value.replace("|", "\\|").replace("\n", " ") for value in values) + " |")
          if not findings:
              lines.append("| — | — | — | No findings |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("Cppcheck finding counts:", dict(counts))
          # Enforce error-severity findings except parser/configuration failures.
          # Warning, performance and portability findings remain informational.
          parser_ids = {"unknownMacro", "syntaxError"}
          parser_failures = [item for item in findings if item.get("id") in parser_ids]
          affected_files = sorted(
              {item.get("file0") for item in parser_failures if item.get("file0")}
              | {loc.get("file") for item in parser_failures
                 for loc in item.findall("location") if loc.get("file")}
          )
          coverage = [
              "", "#### Analysis coverage", "",
              f"Parser/configuration failures: {len(parser_failures)}",
              f"Affected files: {len(affected_files)}",
          ]
          if parser_failures:
              coverage.append("**Incomplete analysis:** affected files may not have been fully analyzed.")
              coverage.extend(f"- `{path}`" for path in affected_files)
          else:
              coverage.append("No parser/configuration failures reported.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(coverage) + "\n")
          print(f"Cppcheck parser/configuration failures: {len(parser_failures)}")
          print(f"Affected files ({len(affected_files)}):")
          for path in affected_files:
              print(f"  {path}")
          if parser_failures:
              print("WARNING: Cppcheck analysis coverage is incomplete.")
          # Parser failures indicate incomplete coverage and must fail CI.
          # Keep them visible in the summary alongside other diagnostics.
          errors = [item for item in findings
                    if item.get("severity") == "error"
                    and item.get("id") not in parser_ids]
          if parser_failures:
              raise SystemExit(
                  f"Cppcheck reported {len(parser_failures)} parser/configuration "
                  "failure(s) in the analyzed source; see Analysis coverage"
              )
          if errors:
              raise SystemExit(f"Cppcheck reported {len(errors)} error-severity finding(s)")
          PY

  flawfinder:
    name: Flawfinder (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan native source
        uses: david-a-wheeler/flawfinder@c4216b74cf2639ffa98503768bd6e4299b5440c9 # 2.0.20
        with:
          arguments: '--sarif src/'
          output: flawfinder-results.sarif

      - name: Upload Flawfinder SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: flawfinder-results.sarif

  analyze-msvc:
    name: MSVC Code Analysis (Release x64)
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Analyze native C++ projects
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:normal '/flp:logfile=msvc-analysis.log;verbosity=normal' /p:Configuration=Release /p:Platform=x64 /p:RegisterOutput=false /p:RunCodeAnalysis=true
          if ($LASTEXITCODE -ne 0) { throw "MSVC static-analysis build failed with exit code $LASTEXITCODE" }

      - name: Summarize MSVC analysis diagnostics
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'msvc-analysis.log')) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### MSVC analysis diagnostics: build log unavailable'
            exit 0
          }
          $diagnostics = @(Get-Content -LiteralPath 'msvc-analysis.log' | Where-Object {
            $_ -match '\bwarning\s+[CD]\d+\s*:'
          } | Sort-Object -Unique)
          $counts = @{}
          foreach ($entry in $diagnostics) {
            if ($entry -match '\bwarning\s+(?<rule>[CD]\d+)\s*:') {
              $rule = $Matches.rule
              if (-not $counts.ContainsKey($rule)) { $counts[$rule] = 0 }
              $counts[$rule]++
            }
          }
          $summary = @('### MSVC analysis diagnostics', '', "Unique diagnostic lines: $($diagnostics.Count)", '', '| Rule | Count |', '|---|---:|')
          foreach ($rule in @($counts.Keys | Sort-Object)) { $summary += "| $rule | $($counts[$rule]) |" }
          if (-not $counts.Count) { $summary += '| None | 0 |' }
          $summary += @('', '#### Findings', '', '| Diagnostic |', '|---|')
          # Keep the summary comfortably below GitHub's per-step size limit.
          # Counts above include all unique diagnostics; only details are truncated.
          $maxFindings = 100
          foreach ($entry in @($diagnostics | Select-Object -First $maxFindings)) {
            $line = $entry.Trim()
            if ($line.Length -gt 500) { $line = $line.Substring(0, 497) + '...' }
            $summary += '| ' + $line.Replace('|', '\|') + ' |'
          }
          if ($diagnostics.Count -gt $maxFindings) {
            $summary += ''
            $summary += "Showing first $maxFindings of $($diagnostics.Count) unique diagnostic lines. See the full MSBuild log artifact."
          }
          if (-not $diagnostics.Count) { $summary += '| No matching diagnostics |' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")


      - name: Upload complete MSVC analysis log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-analysis-log
          path: msvc-analysis.log
          if-no-files-found: warn



  analyze-clang-tidy:
    name: clang-tidy (Release x64)
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Reject NULL in hand-written C++ sources
        shell: pwsh
        run: |
          # MSBuild's clang-tidy warnings may not fail the build.
          $pattern = '\bNULL\b'
          if (-not ('void* p = NULL;' -match $pattern)) {
            throw 'NULL regression guard failed its control input.'
          }
          $folders = @(
            'src/AlternateStreamOverlay',
            'src/altstrm_common',
            'src/altstrm',
            'src/AlternateStreamTests'
          )
          $violations = @(
            foreach ($folder in $folders) {
              Get-ChildItem -LiteralPath $folder -File |
                Where-Object { $_.Extension -in '.cpp', '.h', '.hpp' } |
                Select-String -Pattern $pattern -CaseSensitive |
                ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            }
          )
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Error $_ }
            throw "Found $($violations.Count) NULL occurrence(s) in C++ sources."
          }

      - name: Analyze C++ Core Guidelines with clang-tidy
        shell: pwsh
        run: |
          msbuild .\src\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:normal '/flp:logfile=clang-tidy-analysis.log;verbosity=normal' /p:Configuration=Release /p:Platform=x64 /p:RegisterOutput=false /p:RunCodeAnalysis=true /p:EnableMicrosoftCodeAnalysis=false /p:EnableClangTidyCodeAnalysis=true
          if ($LASTEXITCODE -ne 0) { throw "clang-tidy analysis build failed with exit code $LASTEXITCODE" }

      - name: Summarize clang-tidy diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = 'clang-tidy-analysis.log'
          if (-not (Test-Path -LiteralPath $log)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### clang-tidy diagnostics: build log unavailable'
            exit 0
          }
          $diagnostics = @(Get-Content -LiteralPath $log | Where-Object {
            $_ -match 'warning\s*:.*\[[a-zA-Z][a-zA-Z0-9_.-]+\]'
          } | Sort-Object -Unique)
          $counts = @{}
          foreach ($entry in $diagnostics) {
            if ($entry -match '\[(?<rule>[a-zA-Z][a-zA-Z0-9_.-]+)\]') {
              $rule = $Matches.rule
              if (-not $counts.ContainsKey($rule)) { $counts[$rule] = 0 }
              $counts[$rule]++
            }
          }
          $summary = @('### clang-tidy diagnostics', '', "Unique diagnostic lines: $($diagnostics.Count)", '', '| Check | Count |', '|---|---:|')
          foreach ($rule in @($counts.Keys | Sort-Object)) { $summary += "| $rule | $($counts[$rule]) |" }
          if (-not $counts.Count) { $summary += '| None | 0 |' }
          $summary += @('', '#### Findings', '', '| Diagnostic |', '|---|')
          $maxFindings = 100
          foreach ($entry in @($diagnostics | Select-Object -First $maxFindings)) {
            $line = $entry.Trim()
            if ($line.Length -gt 500) { $line = $line.Substring(0, 497) + '...' }
            $summary += '| ' + $line.Replace('|', '\|') + ' |'
          }
          if ($diagnostics.Count -gt $maxFindings) {
            $summary += "Showing first $maxFindings of $($diagnostics.Count) unique diagnostic lines. See the full build log artifact."
          }
          if (-not $diagnostics.Count) { $summary += '| No matching diagnostics |' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")

      - name: Upload complete clang-tidy analysis log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clang-tidy-analysis-log
          path: clang-tidy-analysis.log
          if-no-files-found: warn
