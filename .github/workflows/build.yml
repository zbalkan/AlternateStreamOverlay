name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build solution
        shell: pwsh
        run: |
          msbuild .\AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:minimal `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:RegisterOutput=false
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
