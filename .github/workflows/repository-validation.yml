name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Markdown
        shell: bash
        run: |
          npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund markdownlint-cli2@0.18.1
          ./node_modules/.bin/markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check GitHub Actions with actionlint
        shell: bash
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color=false

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path .github, src -Recurse -File -Include *.ps1,*.psm1,*.psd1)
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.FullName): $_" }
              throw "PowerShell parse errors in $($script.FullName)"
            }
          }
          Write-Host "Parsed $($scripts.Count) PowerShell scripts."

      - name: Exercise release-notes generator
        shell: pwsh
        run: |
          & ./.github/scripts/Test-ReleaseNotes.ps1
