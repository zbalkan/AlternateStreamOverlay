name: Shell Registration Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/AlternateStreamOverlay/**'
      - 'src/AlternateStreamOverlay.sln'
      - 'src/altstrm_common/**'
      - 'src/tests/*.ps1'
      - '.github/workflows/shell-registration.yml'
  push:
    branches: [main]
    paths:
      - 'src/AlternateStreamOverlay/**'
      - 'src/AlternateStreamOverlay.sln'
      - 'src/altstrm_common/**'
      - 'src/tests/*.ps1'
      - '.github/workflows/shell-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-registration:
    name: Shell registration smoke test
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -LiteralPath ./src/tests -Filter '*.ps1' -File)
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              throw "PowerShell syntax check failed for $($script.Name)"
            }
          }
          Write-Host "Validated $($scripts.Count) PowerShell scripts."

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build shell extension
        shell: pwsh
        run: |
          msbuild ./src/AlternateStreamOverlay.sln /t:Rebuild /m /nologo /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 /p:RegisterOutput=false
          if ($LASTEXITCODE -ne 0) { throw "MSBuild exited with $LASTEXITCODE" }

      - name: Register and audit shell handlers
        shell: pwsh
        run: |
          $dll = (Resolve-Path -LiteralPath './src/AlternateStreamOverlay/x64/Release/AlternateStreamOverlay.dll').Path
          $regsvr32 = Join-Path $env:WINDIR 'System32/regsvr32.exe'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Machine-wide COM registration requires an elevated administrator token.'
          }

          function Invoke-RegistrationProcess {
            param(
              [Parameter(Mandatory)][string] $FilePath,
              [Parameter(Mandatory)][string] $Arguments
            )
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $FilePath
            $startInfo.Arguments = $Arguments
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true

            $process = [System.Diagnostics.Process]::new()
            try {
              $process.StartInfo = $startInfo
              if (-not $process.Start()) { throw "Could not start $FilePath" }
              $process.WaitForExit()
              return $process.ExitCode
            }
            finally {
              $process.Dispose()
            }
          }

          $quotedDll = '"' + $dll + '"'
          $registered = $false
          try {
            $exitCode = Invoke-RegistrationProcess -FilePath $regsvr32 -Arguments "/s $quotedDll"
            if ($exitCode -ne 0) {
              throw "regsvr32 registration failed with exit code $exitCode"
            }
            $registered = $true
            & ./src/tests/Test-ShellHandlerRegistration.ps1 -FailOnIssues
            & ./src/tests/Get-OverlayRegistration.ps1 -RequireRegistration
            # Compare exactly the same DLL under the previous Both model and
            # the proposed Apartment model. Restore the registration even if
            # a probe fails; the outer finally unregisters the DLL.
            $hive = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::LocalMachine,
              [Microsoft.Win32.RegistryView]::Registry64)
            $clsids = @(
              '{4A26024B-5499-45BE-A23F-4A65E88888D0}',
              '{FBAB8C58-59C9-4522-B7E8-1A6AA23B318C}'
            )
            try {
              $keys = @()
              foreach ($clsid in $clsids) {
                $key = $hive.OpenSubKey("SOFTWARE\Classes\CLSID\$clsid\InprocServer32", $true)
                if ($null -eq $key) { throw "Missing writable registration for $clsid" }
                $keys += $key
              }
              try {
                foreach ($key in $keys) { $key.SetValue('ThreadingModel', 'Both') }
                & pwsh -NoProfile -File ./src/tests/Test-ComApartmentActivation.ps1 -ExpectedRegistration Both
                $bothExitCode = $LASTEXITCODE
                foreach ($key in $keys) { $key.SetValue('ThreadingModel', 'Apartment') }
                & pwsh -NoProfile -File ./src/tests/Test-ComApartmentActivation.ps1 -ExpectedRegistration Apartment
                $apartmentExitCode = $LASTEXITCODE
                Write-Host "Activation probe exit codes: Both=$bothExitCode, Apartment=$apartmentExitCode"
                if ($bothExitCode -ne 0 -or $apartmentExitCode -ne 0) {
                  throw "Activation comparison failed: Both=$bothExitCode, Apartment=$apartmentExitCode"
                }
              }
              finally {
                foreach ($key in $keys) {
                  try { $key.SetValue('ThreadingModel', 'Apartment') }
                  finally { $key.Dispose() }
                }
              }
            }
            finally { $hive.Dispose() }

          }
          finally {
            if ($registered) {
              $exitCode = Invoke-RegistrationProcess -FilePath $regsvr32 -Arguments "/u /s $quotedDll"
              if ($exitCode -ne 0) {
                Write-Warning "Shell extension cleanup returned exit code $exitCode"
              }
            }
          }
